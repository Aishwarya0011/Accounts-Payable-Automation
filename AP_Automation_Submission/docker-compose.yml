services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ap_automation
      POSTGRES_USER: ap_user
      POSTGRES_PASSWORD: ap_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap_user -d ap_automation"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    command: sh -c "python manage.py makemigrations ap && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://ap_user:ap_password@db:5432/ap_automation
      DJANGO_SECRET_KEY: local-development-key-change-me
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/app/media
volumes:
  postgres_data:
  uploads:
