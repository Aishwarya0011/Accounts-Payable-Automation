{% extends "base.html" %}
{% block title %}Vendor{% endblock %}
{% block body %}
<h1>{{ 'Edit vendor' if vendor and vendor.id is defined else 'Add vendor' }}</h1>
<form method="post" class="grid">
  <label>Name <input name="name" value="{{ vendor.name if vendor else '' }}" required></label>
  <label>GSTIN <input name="gstin" value="{{ vendor.gstin if vendor else '' }}" required placeholder="29AABCS1234F1Z5"></label>
  <label>PAN <input name="pan" value="{{ vendor.pan if vendor else '' }}"></label>
  <label>Email <input name="email" value="{{ vendor.email if vendor else '' }}"></label>
  <label>Bank name <input name="bank_name" value="{{ vendor.bank_name if vendor else '' }}"></label>
  <label>Account number <input name="account_no" value="{{ vendor.account_no if vendor else '' }}"></label>
  <label>IFSC <input name="ifsc" value="{{ vendor.ifsc if vendor else '' }}"></label>
  <div class="full"><button class="primary">Save vendor</button> <a href="{{ url_for('vendors') }}">Cancel</a></div>
</form>
{% endblock %}
